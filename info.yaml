# Tiny Tapeout project information
project:
  title:        "Tiny4 CPU with Serial Loader"
  author:       "Garv R Jain"
  discord:      ""
  description:  "A compact 4-bit accumulator-based CPU with ALU operations, branching, and a serial instruction loader interface. Designed for minimal area (170 cells)."
  language:     "Verilog"
  clock_hz:     100000000

  tiles: "1x1"

  top_module:  "tt_um_tiny4_cpu"

  source_files:
    - "project.v"

pinout:
  # Inputs (match your ui_in usage)
  ui[0]: "LOAD_MODE (1 = program load, 0 = execute)"
  ui[1]: "LOAD_CLK (shift clock for instruction loading)"
  ui[2]: "DATA_IN (serial instruction input)"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "ACC[0]"
  uo[1]: "ACC[1]"
  uo[2]: "ACC[2]"
  uo[3]: "ACC[3]"
  uo[4]: "0"
  uo[5]: "0"
  uo[6]: "0"
  uo[7]: "0"

  # Bidirectional (used as outputs)
  uio[0]: "PC[0]"
  uio[1]: "PC[1]"
  uio[2]: "PC[2]"
  uio[3]: "Zero Flag"
  uio[4]: "Carry Flag"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

yaml_version: 6
